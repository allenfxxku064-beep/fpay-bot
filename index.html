<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FPAY 钱包演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column, sticky balance header, fixed tab bar; sheets slide up from the bottom. */
:root{
  /* single dark look by choice: graphite + brushed gold */
  --bg:#0B0B0D; --surface:#151518; --surface2:#1F1F24; --line:#2E2C28;
  --fg:#F2EBDD; --muted:#A9A091; --accent:#D4AF5A; --accent-ink:#141210; --accent-soft:#2C2616;
  --good:#5FC48E; --good-soft:#15291E; --warn:#E3B45B; --warn-soft:#2E2412; --bad:#E5675A;
  --card1:#121110; --card2:#4E3F1C; --card-ink:#F2EBDD;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-head:"Noto Serif SC","Songti SC",serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent)!important;color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px}
.top .who{display:flex;flex-direction:column;line-height:1.25}
.top .who b{font-size:17px;font-family:var(--f-head);font-weight:900;letter-spacing:.06em;color:var(--accent)}
.top .who span{font-size:12px;color:var(--muted)}
.demo-tag{margin-left:auto;font-size:10px;letter-spacing:.14em;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-weight:700}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--f-head);font-weight:900;letter-spacing:.04em;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-size:12px;color:var(--muted);font-weight:400}
.label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.balance{font-size:34px;font-weight:700;line-height:1.1;color:var(--accent)}
.balance small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{min-height:64px;border:none;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}
.act svg{width:22px;height:22px;stroke:var(--accent)}
.btn{min-height:46px;border:none;border-radius:12px;padding:0 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.good{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .k{color:var(--muted);font-size:13px}
.tx{display:flex;flex-direction:column}
.tx .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.tx .item:first-child{border-top:none}
.tx .item div{display:flex;flex-direction:column;min-width:0}
.tx .item div span{font-size:12px;color:var(--muted)}
.plus{color:var(--good)} .minus{color:var(--fg)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--warn-soft);color:var(--bad)}
.bonus{border-radius:12px;background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bonus b{font-size:18px}.bonus b small{font-size:12px;color:var(--muted);font-weight:500}
.bonus span:last-child{font-size:11px;color:var(--muted)}
.bonus-tag{color:var(--warn)}
/* casino (single dark felt + gold look, deliberate) */
.ctile-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ctile{border:1px solid #6B5A2A;border-radius:14px;background:#13261F;color:#F3E6C4;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ctile b{font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;color:#E8C66A}
.ctile span{font-size:11px;color:#C9BC9A}
.cz{position:fixed;inset:0;z-index:26;background:#0D2A21;color:#F3E6C4;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;color-scheme:dark;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cz>*{width:100%;max-width:460px}
.cz .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cz h3{margin:0;font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;color:#E8C66A;letter-spacing:.06em}
.cz .x{min-width:44px;min-height:44px;border:1px solid #6B5A2A;border-radius:10px;background:none;color:#E8C66A}
.cz .bar{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#C9BC9A}
.cz .bar b{color:#F3E6C4}
.felt{border-radius:18px;background:#145040;border:2px solid #8A7232;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.bets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bet{min-height:64px;border:1px solid #8A7232;border-radius:12px;background:#10392E;color:#F3E6C4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.bet b{font-size:16px}.bet span{font-size:11px;color:#C9BC9A}.bet i{font-style:normal;font-size:12px;color:#E8C66A;font-weight:700;min-height:16px}
.bet.on{background:#3A3115;border-color:#E8C66A}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip-btn{width:52px;height:52px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);font-weight:700;font-size:13px;color:#FFFFFF}
.chip-btn.c10{background:#2F6FB5}.chip-btn.c50{background:#B5442F}.chip-btn.c100{background:#2E2E2E}.chip-btn.c500{background:#7A3FA0}
.chip-btn.sel{outline:3px solid #E8C66A;outline-offset:2px}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtn{min-height:50px;border:none;border-radius:12px;background:#E8C66A;color:#1A1405;font-weight:900;font-size:16px}
.cbtn.ghost{background:none;border:1px solid #8A7232;color:#E8C66A;font-weight:500}
.cbtn:disabled{opacity:.4}
.balls{display:flex;gap:10px;align-items:center;justify-content:center;font-family:var(--f-num);font-size:26px;font-weight:700}
.ball{width:54px;height:54px;border-radius:50%;background:#F3E6C4;color:#1A1405;display:grid;place-items:center;box-shadow:inset -4px -6px 0 rgba(0,0,0,.15)}
.ball.sum{background:#E8C66A}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;background:#10392E}
.tag{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:0 5px;font-size:12px;font-weight:700;margin-left:4px}
.tag.r{background:#B5442F;color:#FFF}.tag.b{background:#2F6FB5;color:#FFF}.tag.g{background:#3F8F5A;color:#FFF}
.dice{display:flex;gap:12px;justify-content:center}
.die{width:58px;height:58px;border-radius:12px;background:#F7F1E1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:inset -3px -4px 0 rgba(0,0,0,.15)}
.die i{width:11px;height:11px;border-radius:50%;background:#1A1405;align-self:center;justify-self:center;visibility:hidden}
.die i.on{visibility:visible}.die.red i{background:#B5442F}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.hand{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.hand .lbl{font-family:"Noto Serif SC",serif;font-weight:900;color:#E8C66A}
.cards2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:74px}
.pc{width:48px;height:70px;border-radius:7px;background:#FBF8F0;color:#1A1405;display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.3);animation:deal .25s ease-out}
.pc.red{color:#B5442F}.pc .s{align-self:flex-end;font-size:18px}
@keyframes deal{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.road{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.road span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#FFF}
.verdict{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;color:#E8C66A;min-height:30px;text-align:center}
.grabbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.grabbers div{border-radius:10px;background:#10392E;border:1px solid #6B5A2A;padding:8px;text-align:center;font-size:12px}
.grabbers div b{display:block;font-family:var(--f-num);font-size:18px}
.grabbers div.mine{border-color:#E8C66A;background:#3A3115}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.nums button{min-height:44px;border-radius:10px;border:1px solid #8A7232;background:#10392E;color:#F3E6C4;font-family:var(--f-num);font-size:17px}
.nums button.on{background:#E8C66A;color:#1A1405;font-weight:700}
.cz .fine{font-size:12px;color:#C9BC9A;text-align:center;margin:0}
@media (prefers-reduced-motion: reduce){.die.roll{animation:none}.pc{animation:none}}
/* sign-in */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border-radius:10px;border:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.day b{font-family:var(--f-num);font-size:13px;color:var(--fg)}
.day.done{background:var(--good-soft);border-color:var(--good)} .day.done b{color:var(--good)}
.day.today{border:2px solid var(--accent)}
/* wheel */
.wheel-wrap{position:relative;width:min(240px,70vw);aspect-ratio:1;max-width:100%;align-self:center}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid var(--accent);transition:transform 3.2s cubic-bezier(.17,.84,.25,1);overflow:hidden}
.wheel .seg{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .seg span{position:absolute;left:-36px;top:calc(-1 * min(102px,30vw));width:72px;text-align:center;font-size:11px;font-weight:700;color:var(--fg)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--bad);z-index:2}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;z-index:2;box-shadow:0 0 0 6px var(--surface)}
.odds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:12px;color:var(--muted)}
/* games list */
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-align:left}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.tile em{font-style:normal;font-size:12px;color:var(--good);font-weight:700}
.tile em.warn{color:var(--warn)}
.merchant{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.merchant:first-of-type{border-top:none}
.merchant div{display:flex;flex-direction:column;min-width:0}
.merchant span{font-size:12px;color:var(--muted)}
.note{font-size:12px;line-height:1.6;border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--warn)}
/* card */
.vcard{border-radius:18px;padding:20px;color:var(--card-ink);border:1px solid var(--accent);background:linear-gradient(135deg,var(--card1),var(--card2));aspect-ratio:1.586;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.vcard.frozen{filter:grayscale(.85) brightness(.85)}
.vcard .cn{font-family:var(--f-num);font-size:clamp(16px,5vw,21px);letter-spacing:2px}
.vcard .bal{font-family:var(--f-num);font-size:22px;font-weight:700}
.vcard small{opacity:.85;font-size:11px}
.vcard .frz{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.35)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface)}
.opt.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.opt span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.err{color:var(--bad);font-size:12px;min-height:18px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.switch input{width:46px;height:26px;accent-color:var(--accent)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{border:none;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .22s ease-out}
.sheet h3{margin:0;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* red packet rain */
.rain{position:fixed;inset:0;z-index:25;background:rgba(8,6,4,.82);overflow:hidden}
.rain .hud{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:18px}
.pkt{position:absolute;top:-70px;width:48px;height:62px;border:1px solid #D4AF5A;border-radius:8px;background:#8E1B14;box-shadow:inset 0 -14px 0 #6E130E;color:#D4AF5A;font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 90px)) rotate(12deg)}}
@media (prefers-reduced-motion: reduce){.wheel{transition-duration:.01s}.sheet{animation:none}.pkt{animation-duration:6s!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true">FP</div>
    <div class="who"><b>FPAY 钱包</b><span id="hdrSub">余额 <span class="num">0.00</span> USDT</span></div>
    <span class="demo-tag">DEMO</span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="主导航"><div class="in">
  <button data-tab="wallet" id="tab-wallet"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2"/><path d="M3 9h18"/></svg>钱包</button>
  <button data-tab="games" id="tab-games"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3"/><circle cx="15.5" cy="12" r=".8"/><circle cx="17.5" cy="14" r=".8"/></svg>游戏</button>
  <button data-tab="card" id="tab-card"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>U卡</button>
  <button data-tab="me" id="tab-me"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>我的</button>
</div></nav>

<script>
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();
  if(tg.setHeaderColor)tg.setHeaderColor('#151518');if(tg.setBackgroundColor)tg.setBackgroundColor('#0B0B0D');
  const sp=tg.initDataUnsafe&&tg.initDataUnsafe.start_param;if(sp&&!location.hash)location.hash=sp;
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&u.first_name){const b=document.querySelector('.top .who b');if(b)b.textContent='FPAY 钱包 · '+u.first_name}}}catch(e){}
(function(){
const KEY='fpay-demo-v2';
const fresh=()=>({tab:'wallet',day:1,balance:1280,points:120,bonus:2,signed:{},streak:0,rainDay:0,coupons:[],
  tx:[{t:'充值',a:1000,d:'示例 · 链上入账'},{t:'红包收入',a:300,d:'示例 · 来自好友'},{t:'转账',a:-20,d:'示例 · 转给好友'}],
  card:null,tasks:{deposit:false,swap:false,card:false},limit:500,todayIn:0,paused:false,merchant:{A:0,B:0}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let toastT;
function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}

function addTx(t,a,d){S.tx.unshift({t,a,d});S.tx=S.tx.slice(0,30)}

function sheet(html,bind){$('#layer').innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';

    transfer:{t:'转账',hint:'转给 FPAY 用户，免手续费',btn:'确认转账'},
    swap:{t:'闪兑 USDT → TRX',hint:'演示汇率 1 USDT ≈ 3.30 TRX',btn:'确认闪兑'}}[kind];
  sheet(`<h3>${cfg.t}</h3><p class="label" style="margin:0">${cfg.hint}</p>
    ${kind==='transfer'?'<div class="field"><label for="to">收款人 FPAY ID</label><input id="to" inputmode="numeric" placeholder="例如 8800123456"></div>':''}
    <div class="field"><label for="amt">金额（USDT）</label><input id="amt" class="num" inputmode="decimal" placeholder="0.00"></div>
    <div class="err" id="err"></div>
    <div class="grid2"><button class="btn ghost" data-close>取消</button><button class="btn" id="ok">${cfg.btn}</button></div>`,()=>{
    $('#ok').onclick=()=>{
      const a=parseFloat($('#amt').value);const err=$('#err');
      if(!(a>0)){err.textContent='请输入大于 0 的金额';return}
      if(kind==='deposit'){S.balance+=a;addTx('充值',a,'USDT-TRC20 入账');S.tasks.deposit=true}
      else{
        const fee=kind==='withdraw'?1:0;const feeCash=kind==='withdraw'&&S.bonus>=1?0:fee;
        if(a+feeCash>S.balance){err.textContent='余额不足，当前可用 '+fmt(S.balance)+' USDT';return}
        if(kind==='transfer'){const to=$('#to').value.trim();if(!/^\d{6,12}$/.test(to)){err.textContent='请输入 6–12 位数字的 FPAY ID';return}
          S.balance-=a;addTx('转账',-a,'转给 '+to)}
        if(kind==='withdraw'){if(S.bonus>=fee){S.bonus-=fee;S.balance-=a;addTx('提现',-a,'手续费 1 USDT 已用礼金抵扣')}else{S.balance-=a+fee;addTx('提现',-(a+fee),'含手续费 1 USDT')}}
        if(kind==='swap'){S.balance-=a;addTx('闪兑',-a,'得到 '+(a*3.3).toFixed(2)+' TRX');S.tasks.swap=true}
      }
      save();closeSheet();render();toast(cfg.t+'成功')}})}

function bindGames(){
  const sb=$('#signBtn');if(sb)sb.onclick=()=>{const n=S.streak+1;const r=SIGN[n-1];S.signed[S.day]=true;S.streak=n>=7?0:n;S.points+=r.p;if(r.b)S.bonus+=r.b;save();render();toast('签到成功 +'+r.p+' 点数'+(r.b?'，送 '+r.b+' USDT 礼金':''))};
  $('#spinBtn').onclick=()=>{if(spinning)return;if(S.points<SPIN_COST){toast('点数不足，先去签到或做任务');return}
    S.points-=SPIN_COST;let r=Math.random()*100,i=0;for(;i<PRIZES.length;i++){r-=PRIZES[i].p;if(r<0)break}
    const target=360-(i*60+30);rot=rot-(rot%360)+360*5+target;spinning=true;$('#wheel').style.transform='rotate('+rot+'deg)';$('#spinBtn').disabled=true;
    setTimeout(()=>{spinning=false;const pz=PRIZES[i].n;
      if(pz==='点数×2'){S.points+=SPIN_COST*2;toast('抽中 点数×2，返还 '+SPIN_COST*2+' 点数')}
      else if(pz==='谢谢参与'){toast('谢谢参与，再试一次')}
      else if(PRIZES[i].b){S.bonus+=PRIZES[i].b;addTx('抽奖礼金',0,'获得 '+PRIZES[i].b+' USDT 礼金');toast('抽中 '+pz+'，已存入礼金')}
      else{S.coupons.push(pz);toast('抽中 '+pz+'，已放入券包')}
      save();render()},window.matchMedia('(prefers-reduced-motion: reduce)').matches?50:3300)};
  const rb=$('#rainBtn');if(rb)rb.onclick=startRain;
  document.querySelectorAll('[data-cz]').forEach(b=>b.onclick=()=>openCasino(b.dataset.cz));
  const dc=$('#dailyChips');if(dc)dc.onclick=()=>{S.chipDay=S.day;S.points+=500;save();render();toast('已领 500 点数')};
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{S.bonus+=+b.dataset.p;S.tasks[b.dataset.claim]='claimed';addTx('任务礼金',0,'获得 '+b.dataset.p+' USDT 礼金');save();render();toast('已领取 '+b.dataset.p+' USDT 礼金')});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>merchantSheet(b.dataset.m));
  $('#nextDay').onclick=()=>{S.day+=1;S.todayIn=0;save();render();toast('已进入第 '+S.day+' 天')};
}
function startRain(){
  S.rainDay=S.day;save();let got=0,left=8;
  const L=$('#layer');L.innerHTML='<div class="rain" id="rain"><div class="hud" aria-live="polite">剩余 <span id="rl">8</span> 秒 · 已得 <span id="rg">0.00</span> USDT 礼金（上限 3）</div></div>';
  const R=$('#rain');
  const spawn=setInterval(()=>{const b=document.createElement('button');b.className='pkt';b.textContent='福';b.setAttribute('aria-label','红包');
    b.style.left=(5+Math.random()*80)+'%';b.style.animationDuration=(2.2+Math.random()*1.6)+'s';
    b.onclick=()=>{const v=Math.round((0.05+Math.random()*0.25)*100)/100;got=Math.min(3,Math.round((got+v)*100)/100);$('#rg').textContent=got.toFixed(2);b.remove()};
    b.addEventListener('animationend',()=>b.remove());R.appendChild(b)},280);
  const tick=setInterval(()=>{left--;$('#rl').textContent=left;if(left<=0){clearInterval(tick);clearInterval(spawn);
    S.bonus+=got;if(got>0)addTx('红包雨礼金',0,'获得 '+got.toFixed(2)+' USDT 礼金');save();L.innerHTML='';render();toast('红包雨结束，获得 '+got.toFixed(2)+' USDT 礼金')}},1000)}

function czNiu(){
  czShell('牛牛',`<div class="felt"><div class="hand"><span class="lbl">庄家 <span id="nB"></span></span><div class="cards2" id="cB"></div></div>
    <div class="hand"><span class="lbl">你 <span id="nP"></span></span><div class="cards2" id="cP"></div></div><div class="verdict" id="nv" aria-live="polite">选择下注点数后开牌</div></div>
    <div class="chips" role="group" aria-label="下注点数">${CHIPS.map((c,i)=>`<button class="chip-btn c${c} ${i===0?'sel':''}" data-chip="${c}">${c}</button>`).join('')}</div>
    <p class="fine">比牛：五张里任三张和为 10 的倍数即「有牛」，剩下两张和的个位为牛几，个位 0 为牛牛。牛牛赢 3 倍，牛七至牛九赢 2 倍，其他赢 1 倍；输时按同样倍数扣点。</p>
    <button class="cbtn" id="ngo">开牌</button>`);
  let chip=10;document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{chip=+b.dataset.chip;document.querySelectorAll('[data-chip]').forEach(x=>x.classList.toggle('sel',x===b))});
  const v=c=>Math.min(10,c.r);
  const niu=h=>{for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)for(let k=j+1;k<5;k++){if((v(h[i])+v(h[j])+v(h[k]))%10===0){const rest=h.reduce((a,c,ix)=>ix===i||ix===j||ix===k?a:a+v(c),0)%10;return rest===0?10:rest}}return 0};
  const nname=n=>n===10?'牛牛':n===0?'没牛':'牛'+'一二三四五六七八九'[n-1];
  const mult=n=>n===10?3:n>=7?2:1;const hi=h=>Math.max(...h.map(c=>c.r*4+c.s));
  let busy=false;
  $('#ngo').onclick=()=>{if(busy)return;if(chip*3>S.points){toast('点数不足（最多可能输 3 倍）');return}busy=true;
    const P=Array.from({length:5},card),B=Array.from({length:5},card);$('#cP').innerHTML='';$('#cB').innerHTML='';$('#nP').textContent='';$('#nB').textContent='';$('#nv').textContent='发牌中…';
    for(let i=0;i<5;i++){setTimeout(()=>$('#cB').insertAdjacentHTML('beforeend',cardHtml(B[i])),i*180);setTimeout(()=>$('#cP').insertAdjacentHTML('beforeend',cardHtml(P[i])),i*180+90)}
    setTimeout(()=>{const a=niu(P),b=niu(B);$('#nP').textContent=nname(a);$('#nB').textContent=nname(b);
      const win=a>b||(a===b&&hi(P)>hi(B));const m=mult(win?a:b);const d=chip*m;S.points+=win?d:-d;save();czPts();
      $('#nv').textContent=(win?'你赢 ':'庄赢 ')+d+' 点数（'+m+' 倍）';busy=false},1100)}}

function czMine(){
  czShell('扫雷红包',`<div class="felt"><div class="verdict">你发红包，6 人来抢</div>
    <p class="fine" style="color:#F3E6C4">选一个雷号。谁抢到的点数个位等于雷号，就要赔你红包金额的 1.5 倍。</p>
    <div class="nums" role="group" aria-label="选择雷号">${Array.from({length:10},(_,i)=>`<button data-n="${i}" class="${i===7?'on':''}">${i}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="红包金额">${[50,100,200,500].map((c,i)=>`<button class="chip-btn c${[10,50,100,500][i]} ${i===1?'sel':''}" data-amt="${c}">${c}</button>`).join('')}</div>
    <div class="grabbers" id="gb">${Array.from({length:6},(_,i)=>`<div>玩家 ${i+1}<b>—</b></div>`).join('')}</div>
    <div class="verdict" id="mv" aria-live="polite"></div></div>
    <button class="cbtn" id="msend">发红包</button>`);
  let mine=7,amt=100,busy=false;
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{mine=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{amt=+b.dataset.amt;document.querySelectorAll('[data-amt]').forEach(x=>x.classList.toggle('sel',x===b))});
  $('#msend').onclick=()=>{if(busy)return;if(amt>S.points){toast('点数不足');return}busy=true;S.points-=amt;czPts();
    const cuts=Array.from({length:5},()=>1+Math.floor(Math.random()*(amt-1))).sort((a,b)=>a-b);const sh=[];let prev=0;for(const c of cuts){sh.push(c-prev);prev=c}sh.push(amt-prev);
    for(let i=0;i<6;i++)if(sh[i]<=0){const j=sh.indexOf(Math.max(...sh));sh[j]--;sh[i]=1}
    const gb=$('#gb').children;let hits=0;$('#mv').textContent='抢红包中…';
    sh.forEach((v,i)=>setTimeout(()=>{const hit=v%10===mine;if(hit)hits++;gb[i].className=hit?'mine':'';gb[i].innerHTML='玩家 '+(i+1)+'<b>'+v+'</b>'+(hit?'中雷':'')},i*260));
    setTimeout(()=>{const gain=Math.round(hits*amt*1.5);S.points+=gain;save();czPts();
      $('#mv').textContent=hits?hits+' 人中雷，赔你 '+gain+' 点数（净 '+(gain-amt>=0?'+':'')+(gain-amt)+'）':'没人中雷，红包 '+amt+' 点数被抢光';busy=false},6*260+300)}}

/* ---------- render ---------- */
function render(){
  $('#hdrSub').innerHTML='余额 <span class="num">'+fmt(S.balance)+'</span> USDT · 礼金 <span class="num">'+fmt(S.bonus)+'</span>';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.toggleAttribute('aria-current',false));
  $('#tab-'+S.tab).setAttribute('aria-current','page');
  const v=$('#view');
  if(S.tab==='wallet'){v.innerHTML=vWallet();document.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>amountSheet(b.dataset.amt));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));$('#exBtn').onclick=exSheet}
  if(S.tab==='games'){v.innerHTML=vGames();bindGames()}
  if(S.tab==='card'){v.innerHTML=vCard();bindCard()}
  if(S.tab==='me'){v.innerHTML=vMe();bindMe()}
}
render();
/* 深层链接：网址 #pc28 / #card / #deposit 等直接打开对应功能 */
(function(){try{const h=(location.hash||'').slice(1).toLowerCase();if(!h)return;
  const tabs={wallet:1,games:1,card:1,me:1},cz={pc28:1,dice:1,bac:1,niu:1,mine:1},sh={deposit:1,withdraw:1,transfer:1,swap:1};
  if(tabs[h])setTab(h);else if(cz[h]){setTab('games');openCasino(h)}else if(sh[h]){setTab('wallet');amountSheet(h)}else if(h==='ex'){setTab('wallet');exSheet()}
}catch(e){}})();
})();
</script>
